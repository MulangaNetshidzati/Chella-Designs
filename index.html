<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chella Designs | Create • Customise • Inspire</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

<style>
:root{
  --pink:#ec4899;--pink-soft:#f9a8d4;--pink-deep:#be185d;
  --purple:#a855f7;--purple-deep:#7e22ce;
  --teal:#14b8a6;--teal-deep:#0f766e;
  --gold:#eab308;--gold-deep:#ca8a04;--orange:#f97316;
  --ink:#15121c;--muted:#6b7280;--line:#f1e6ee;
  --bg:#fffafc;--card:#ffffff;
  --radius:22px;--radius-sm:14px;
  --shadow:0 10px 30px rgba(190,24,93,.10);
  --shadow-lg:0 24px 60px rgba(126,34,206,.18);
  --grad-pink:linear-gradient(135deg,#ec4899,#a855f7);
  --grad-teal:linear-gradient(135deg,#14b8a6,#22d3ee);
  --grad-gold:linear-gradient(135deg,#eab308,#f97316);
  --grad-rainbow:linear-gradient(120deg,#ec4899,#a855f7,#14b8a6,#eab308,#f97316);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Poppins',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;
  overflow-x:hidden;min-height:100vh;min-height:-webkit-fill-available;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4{font-family:'Playfair Display',serif;line-height:1.2}
.script{font-family:'Dancing Script',cursive}
a{text-decoration:none;color:inherit;cursor:pointer}
button{font-family:'Poppins',sans-serif;cursor:pointer;border:none}
input,textarea,select{font-family:'Poppins',sans-serif;font-size:16px;-webkit-appearance:none;appearance:none}
img,svg{max-width:100%;display:block}

.bg-blobs{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:floaty 18s ease-in-out infinite}
.blob.b1{width:420px;height:420px;background:#f9a8d4;top:-120px;left:-100px}
.blob.b2{width:380px;height:380px;background:#99f6e4;top:35%;right:-140px;animation-delay:-5s}
.blob.b3{width:340px;height:340px;background:#e9d5ff;bottom:-120px;left:20%;animation-delay:-9s}
.blob.b4{width:280px;height:280px;background:#fde68a;bottom:20%;right:25%;animation-delay:-13s}
@keyframes floaty{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-50px) scale(1.12)}66%{transform:translate(-35px,35px) scale(.92)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes gradShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.6)}100%{transform:scale(1)}}

/* HEADER */
header{position:sticky;top:0;z-index:900;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);box-shadow:0 4px 24px rgba(190,24,93,.06);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.nav-wrap{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 20px}
.logo-container{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo-img{height:52px;width:52px;object-fit:contain;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(190,24,93,.18);transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.logo-container:hover .logo-img{transform:rotate(-8deg) scale(1.08)}
.logo-fallback{height:52px;width:52px;border-radius:50%;display:none;align-items:center;justify-content:center;background:var(--grad-pink);color:#fff;font-family:'Dancing Script',cursive;font-size:1.3rem;font-weight:700;box-shadow:0 4px 16px rgba(190,24,93,.3)}
.brand-text{display:flex;flex-direction:column;line-height:1}
.brand-text .b1{font-family:'Dancing Script',cursive;font-size:1.7rem;font-weight:700;background:var(--grad-pink);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-text .b2{font-size:.55rem;letter-spacing:.32em;color:var(--teal-deep);font-weight:600;margin-top:1px}

nav ul{list-style:none;display:flex;align-items:center;gap:4px}
nav a.nav-link{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:14px;font-size:.72rem;font-weight:600;color:var(--muted);position:relative;transition:.28s;cursor:pointer}
nav a.nav-link .nav-ico{font-size:1.15rem;line-height:1;transition:transform .35s cubic-bezier(.34,1.56,.64,1);display:inline-flex}
nav a.nav-link:hover{color:var(--pink-deep);background:#fff0f7}
nav a.nav-link:hover .nav-ico{transform:translateY(-4px) scale(1.18)}
nav a.nav-link.active{color:var(--pink-deep);background:linear-gradient(135deg,#fff0f7,#f3e8ff)}
nav a.nav-link.active::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:3px;background:var(--grad-pink)}
nav a.dash-link{color:var(--gold-deep);background:linear-gradient(135deg,#fef3c7,#fde68a)}
nav a.dash-link:hover{color:#3a2c00;background:var(--grad-gold)}
.cart-link{position:relative}
.cart-count{position:absolute;top:0;right:2px;background:var(--grad-pink);color:#fff;border-radius:50%;min-width:19px;height:19px;font-size:.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(236,72,153,.5)}
.cart-count.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.burger{display:none;background:none;font-size:1.6rem;color:var(--pink-deep);padding:6px}

main{max-width:1280px;margin:0 auto;padding:34px 22px 60px;min-height:70vh}
.section{display:none}
.section.active{display:block;animation:fadeUp .45s cubic-bezier(.22,1,.36,1)}
.section-head{text-align:center;margin-bottom:34px}
.section-head h2{font-size:clamp(1.9rem,4vw,2.7rem);color:var(--ink);display:inline-block;position:relative}
.section-head h2 span{background:var(--grad-pink);-webkit-background-clip:text;background-clip:text;color:transparent}
.section-head .underline{width:110px;height:5px;border-radius:5px;margin:12px auto 0;background:var(--grad-rainbow);background-size:300% 100%;animation:gradShift 4s linear infinite}
.section-head p{color:var(--muted);margin-top:12px;font-size:.95rem}

/* HERO */
.hero{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,#fff0f7 0%,#f5f3ff 45%,#ecfeff 100%);padding:48px 30px 44px;text-align:center;box-shadow:var(--shadow-lg);border:1px solid #fff}
.hero h1{font-size:clamp(2rem,6vw,3.8rem);margin:18px 0 6px;animation:fadeUp .8s both}
.hero h1 .script{display:block;font-size:1.15em;background:var(--grad-pink);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 .sub{display:block;font-size:.42em;letter-spacing:.3em;color:var(--ink);font-family:'Poppins';font-weight:600;margin-top:8px}
.hero p.lead{max-width:640px;margin:16px auto 0;color:var(--muted);font-size:1rem;animation:fadeUp .9s .12s both}
.hero-stats{display:flex;justify-content:center;gap:32px;flex-wrap:wrap;margin-top:26px;animation:fadeUp 1s .2s both}
.hero-stats div{text-align:center}
.hero-stats strong{display:block;font-family:'Playfair Display';font-size:1.6rem;color:var(--pink-deep)}
.hero-stats span{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.shop-now-wrap{display:flex;justify-content:center;margin-top:30px;animation:fadeUp 1.05s .28s both}
.btn-shop-now{position:relative;display:inline-flex;align-items:center;gap:12px;padding:17px 44px;border-radius:60px;font-size:.98rem;font-weight:700;letter-spacing:.05em;color:#fff;background:var(--grad-pink);box-shadow:0 14px 34px rgba(236,72,153,.42);transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .35s;overflow:hidden}
.btn-shop-now:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 22px 46px rgba(236,72,153,.55)}
.btn-shop-now:active{transform:scale(.97)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 24px;border-radius:50px;font-weight:600;font-size:.9rem;background:var(--grad-teal);color:#fff;transition:.3s;box-shadow:0 8px 20px rgba(20,184,166,.28)}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(20,184,166,.4)}
.btn:active{transform:scale(.97)}
.btn-pink{background:var(--grad-pink);box-shadow:0 8px 20px rgba(236,72,153,.32)}
.btn-pink:hover{box-shadow:0 14px 32px rgba(236,72,153,.46)}
.btn-gold{background:var(--grad-gold);color:#3a2c00;font-weight:700;box-shadow:0 8px 20px rgba(234,179,8,.32)}
.btn-outline{background:#fff;color:var(--pink-deep);border:2px solid var(--pink-soft);box-shadow:none}
.btn-outline:hover{background:#fff0f7;border-color:var(--pink);box-shadow:0 8px 22px rgba(236,72,153,.18)}
.btn-ghost{background:#f4f4f5;color:var(--ink);box-shadow:none}
.btn-ghost:hover{background:#e9e9ec}
.btn-block{width:100%}
.btn-sm{padding:8px 16px;font-size:.78rem}
.btn[disabled]{opacity:.6;cursor:not-allowed;pointer-events:none}

/* SHOP TOOLBAR */
.shop-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.chip-scroller{flex:1;display:flex;gap:10px;overflow-x:auto;scroll-behavior:smooth;padding:6px 2px;scrollbar-width:none;min-width:0}
.chip-scroller::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:50px;background:#fff;border:1.5px solid var(--line);font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap;transition:.3s}
.chip:hover{border-color:var(--pink-soft);color:var(--pink-deep);transform:translateY(-3px)}
.chip.active{background:var(--grad-pink);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(236,72,153,.35)}

/* PRODUCTS */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.product-card{background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;transition:transform .4s cubic-bezier(.34,1.4,.64,1),box-shadow .4s;position:relative;display:flex;flex-direction:column;animation:fadeUp .5s both}
.product-card:hover{transform:translateY(-10px);box-shadow:var(--shadow-lg)}
.p-img{position:relative;height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden; background: #f8f9fa;}
.p-img .glow{position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.65);filter:blur(6px);transition:.5s}
.product-card:hover .p-img .glow{transform:scale(1.5)}
.p-img .emo{position:relative;z-index:2;transition:transform .5s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 10px 16px rgba(0,0,0,.16));font-size:3.8rem;line-height:1; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;}
.p-img .emo img{width:100%;height:100%;object-fit:cover;}
.product-card:hover .p-img .emo{transform:scale(1.18) rotate(-7deg)}
.p-badge{position:absolute;top:12px;left:12px;z-index:3;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:50px;background:rgba(255,255,255,.92);color:var(--purple-deep);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.p-badge.custom{background:var(--grad-pink);color:#fff}
.p-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.p-body .p-cat{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-deep);font-weight:600}
.p-body h4{font-size:1.06rem;font-family:'Poppins';font-weight:600}
.p-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.p-price{font-size:1.25rem;font-weight:700;color:var(--pink-deep);font-family:'Playfair Display'}
.p-price small{font-size:.62rem;color:var(--muted);font-weight:500;display:block;letter-spacing:.06em}
.p-price .p-old{font-size:.78rem;color:var(--muted);text-decoration:line-through;font-family:'Poppins';font-weight:500}
.p-price .p-disc{font-size:.65rem;background:#dcfce7;color:#166534;padding:2px 7px;border-radius:50px;font-weight:700;margin-left:5px}
.p-open{width:40px;height:40px;border-radius:50%;background:#fff0f7;color:var(--pink-deep);display:flex;align-items:center;justify-content:center;font-size:1rem;transition:.3s}
.product-card:hover .p-open{background:var(--grad-pink);color:#fff;transform:rotate(-45deg)}

/* DRAWER */
.drawer-overlay{position:fixed;inset:0;background:rgba(21,18,28,.5);backdrop-filter:blur(4px);z-index:1200;opacity:0;visibility:hidden;transition:.35s}
.drawer-overlay.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(390px,92vw);z-index:1300;background:#fff;box-shadow:-20px 0 60px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .45s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#fff0f7,#f5f3ff)}
.drawer-head h3{font-size:1.25rem}
.drawer-close{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--pink-deep);display:flex;align-items:center;justify-content:center;font-size:1rem;transition:.3s;box-shadow:var(--shadow)}
.drawer-close:hover{background:var(--grad-pink);color:#fff;transform:rotate(90deg)}
.drawer-body{padding:22px 24px;overflow-y:auto;flex:1}
.f-group{margin-bottom:24px}
.f-group h4{font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:13px;font-family:'Poppins';font-weight:700}
.f-check{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:12px;cursor:pointer;font-size:.88rem;transition:.25s;border:1.5px solid transparent}
.f-check:hover{background:#fff7fb;border-color:var(--pink-soft)}
.f-check input{accent-color:var(--pink);width:17px;height:17px;cursor:pointer}
.drawer-foot{padding:18px 24px;border-top:1px solid var(--line);display:flex;gap:12px;background:#fff}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(21,18,28,.55);backdrop-filter:blur(6px);z-index:1500;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:.35s}
.modal-overlay.active{opacity:1;visibility:visible}
.modal-box{background:#fff;border-radius:26px;width:100%;max-width:520px;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:translateY(28px) scale(.96);transition:transform .45s cubic-bezier(.34,1.4,.64,1);overflow:hidden;max-height:92vh;display:flex;flex-direction:column}
.modal-overlay.active .modal-box{transform:translateY(0) scale(1)}
.modal-box.wide{max-width:900px}
.modal-head{padding:20px 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fff0f7,#f5f3ff)}
.modal-head h3{font-size:1.2rem}
.modal-close{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--pink-deep);display:flex;align-items:center;justify-content:center;transition:.3s;box-shadow:var(--shadow)}
.modal-close:hover{background:var(--grad-pink);color:#fff;transform:rotate(90deg)}
.modal-body{padding:24px 26px;overflow-y:auto}
.modal-foot{padding:18px 26px;border-top:1px solid var(--line);display:flex;gap:12px;background:#fcfcfd}
.modal-foot .btn{flex:1}

/* PRODUCT DETAIL */
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.pd-visual{position:relative;display:flex;align-items:center;justify-content:center;min-height:320px;padding:30px;overflow:hidden}
.pd-visual .glow{position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.7);filter:blur(10px);animation:floaty 9s ease-in-out infinite}
.pd-preview{position:relative;z-index:3;width:220px;height:220px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -14px 30px rgba(0,0,0,.07),0 20px 40px rgba(0,0,0,.12);font-size:4.5rem;line-height:1; background: #fff; overflow: hidden;}
.pd-preview img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.pd-info{padding:28px 30px;display:flex;flex-direction:column;gap:14px}
.pd-info .p-cat{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-deep);font-weight:700}
.pd-info h3{font-size:1.6rem}
.pd-price-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pd-price{font-size:2rem;font-weight:800;color:var(--pink-deep);font-family:'Playfair Display'}
.pd-price-old{font-size:.95rem;color:var(--muted);text-decoration:line-through}
.pd-desc{font-size:.88rem;color:var(--muted)}
.pd-section{border-top:1px dashed var(--line);padding-top:16px}
.pd-section h5{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:11px;font-family:'Poppins';font-weight:700}
.qty-row{display:flex;align-items:center;gap:16px}
.qty-ctrl{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:50px;overflow:hidden}
.qty-ctrl button{width:40px;height:42px;background:#fff;font-size:1.15rem;font-weight:700;color:var(--pink-deep);transition:.25s}
.qty-ctrl button:hover{background:#fff0f7}
.qty-ctrl span{width:48px;text-align:center;font-weight:700;font-size:1rem}

/* CART */
.cart-layout{display:grid;grid-template-columns:1.6fr 1fr;gap:26px;align-items:start}
.cart-list{display:flex;flex-direction:column;gap:14px}
.cart-item{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow);transition:.3s;animation:fadeUp .4s both}
.cart-item:hover{box-shadow:var(--shadow-lg);transform:translateX(4px)}
.ci-thumb{width:70px;height:70px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2rem;flex:0 0 auto;background:#fff0f7;overflow:hidden;}
.ci-thumb img{width:100%;height:100%;object-fit:cover;}
.ci-main{flex:1;min-width:0}
.ci-main h4{font-size:.95rem;font-family:'Poppins';font-weight:600;margin-bottom:3px}
.ci-main .ci-cat{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-deep);font-weight:700}
.ci-custom{display:inline-flex;align-items:center;gap:6px;margin-top:7px;font-size:.72rem;background:#f5f3ff;color:var(--purple-deep);padding:5px 11px;border-radius:50px;font-weight:600}
.ci-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.ci-price{font-weight:800;color:var(--pink-deep);font-size:1.05rem;font-family:'Playfair Display'}
.ci-remove{background:#fff0f3;color:#e11d48;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;transition:.3s}
.ci-remove:hover{background:#e11d48;color:#fff;transform:rotate(90deg) scale(1.08)}
.qty-mini{display:flex;align-items:center;gap:10px;background:#fcfcfd;border:1px solid var(--line);border-radius:50px;padding:3px}
.qty-mini button{width:28px;height:28px;border-radius:50%;background:#fff;font-weight:700;color:var(--pink-deep);transition:.25s;font-size:.9rem}
.qty-mini button:hover{background:var(--grad-pink);color:#fff}
.qty-mini span{min-width:20px;text-align:center;font-weight:700;font-size:.85rem}
.summary-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);position:sticky;top:100px}
.summary-card h3{font-size:1.2rem;margin-bottom:18px}
.sum-row{display:flex;justify-content:space-between;padding:9px 0;font-size:.9rem;color:var(--muted)}
.sum-row span:last-child{font-weight:600;color:var(--ink)}
.sum-total{display:flex;justify-content:space-between;align-items:center;border-top:2px dashed var(--line);margin-top:12px;padding-top:16px;font-size:1.3rem;font-weight:800;color:var(--pink-deep);font-family:'Playfair Display'}
.promo-row{display:flex;gap:9px;margin:16px 0}
.promo-row input{flex:1;padding:12px 16px;border:1.5px solid var(--line);border-radius:50px;font-size:.84rem;background:#fcfcfd;transition:.3s;min-width:0}
.promo-row input:focus{outline:none;border-color:var(--pink);background:#fff;box-shadow:0 0 0 4px rgba(236,72,153,.10)}
.promo-row button{padding:0 22px;border-radius:50px;background:var(--ink);color:#fff;font-weight:700;font-size:.8rem;transition:.3s}
.promo-row button:hover{background:var(--purple-deep)}

/* CHECKOUT */
.pay-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:26px;align-items:start}
.pay-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
.pay-card h3{font-size:1.15rem;margin-bottom:20px}
.pay-methods{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:24px}
.pm{border:2px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;transition:.3s;background:#fcfcfd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;}
.pm:hover{border-color:var(--pink-soft);transform:translateY(-3px)}
.pm.active{border-color:var(--pink);background:linear-gradient(135deg,#fff0f7,#f5f3ff);box-shadow:0 8px 20px rgba(236,72,153,.18)}
.pm .pm-ico{font-size:1.4rem;display:flex;align-items:center;justify-content:center;height:24px;}
.pm .pm-name{font-size:.74rem;font-weight:700;color:var(--ink)}
.pm.applepay-pm{grid-column:1/-1;background:#000;color:#fff;border-color:#000}
.pm.applepay-pm.active{background:linear-gradient(135deg,#000,#1a1a1a);border-color:#fff}
.pm.applepay-pm .pm-name{color:#fff;font-size:.92rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card-visual{background:var(--grad-pink);border-radius:20px;padding:22px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(236,72,153,.35)}
.card-visual .cv-chip{width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#fde68a,#d97706);margin-bottom:26px}
